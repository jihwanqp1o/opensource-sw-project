# PR과 main push 때 게임이 정상 실행되는지 자동으로 확인한다.
# 마이크와 Vosk 모델이 없어도 되는 키보드 모드로 실행한다.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      EFFECT_DELAY: "0"
      COLUMNS: "100"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 모듈 단독 실행
        run: |
          python -m battle.engine
          python -m ascii_art.monster
          python -m ascii_art.spell_text
          python -m ui.screen
          python -m ui.menu
          python -m ascii_art.intro
          python -m world.dungeon

      - name: 게임 전체 실행 (테스트 모드)
        run: |
          # 4연전을 업그레이드까지 끝까지 진행 (입력 순서: .github/ci-input.txt). 입력이 모자라면 EOFError로 실패한다.
          python main.py --test < .github/ci-input.txt > game.log
          tail -n 20 game.log
          grep -q "업그레이드 완료" game.log

      - name: 게임 전체 실행 (플레이 모드 흐름)
        env:
          INPUT_MODE: keyboard
        run: |
          # 타이틀 → 주문 목록 → 전투 → 결과 → 타이틀 → 종료
          { printf 'h\n\n\n'; cat .github/ci-input.txt; printf 'q\n'; } | python main.py > play.log
          grep -q "도달 스테이지" play.log

      - name: 게임 전체 실행 (시연 모드 --demo)
        env:
          INPUT_MODE: keyboard
        run: |
          # 몬스터 체력이 줄어 4스테이지까지 가서 끝나야 한다 (갈림길 3번을 지나 /root 도착)
          { printf '\n'; cat .github/ci-input.txt; printf 'q\n'; } | python main.py --demo > demo.log
          grep -qE "도달 스테이지 +4/4" demo.log
          grep -q "cd /root" demo.log
